# 정책 — Claude(본 세션과 drafter)가 무엇을 써도 되고 무엇은 안 되는지. guard.py 가 도구를 부르기 전마다 읽는다.
#
# 목록 밖의 것은 막는다(허용 목록). 모르는 도구가 새로 생겨도 막히게 하려는 것이다.
# settings.json 의 permissions 도 같은 것을 한 번 더 막는다 — 한 곳이 조용히 꺼져도 다른 한 곳이 남게.

# 쓸 수 있는 도구. 하위 에이전트(Agent)는 백그라운드로 띄우지 못하게 guard.py 가 따로 막는다.
allow_tools:
  - Read
  - Write
  - Agent
  - Task
  - Bash

# 파일을 쓸 수 있는 곳. 이 밖의 Write·Edit 은 막는다.
# 요청 폴더의 문의 사본(tickets.json)·상태 파일(state.json·events.jsonl)과 담당 기록(assignments/)은
# Claude 가 쓰지 못한다 — 근거를 문의에 써 넣거나, 큐를 손으로 바꾸지 못하게.
writable:
  - requests/*/draft.json

# Bash 명령에 이 글자가 들어 있으면 막는다(대소문자 무시).
deny_commands:
  - "curl "
  - "wget "
  - "rm -rf"
  - "--no-verify"
  - "sudo "
  # 큐에 넣는 것은 흐름도의 전달 단계(차단 장치가 실행)만 한다 — Claude 가 직접 부르지 않는다
  - "scripts/deliver.py"

# Bash 로 실행해도 되는 명령의 머리. 이 밖은 막는다.
allow_commands:
  - "uv run python scripts/open_request.py"
  - "ls"

# 한 요청 안에서 도구를 부를 수 있는 횟수(본 세션과 drafter 를 합쳐). 넘으면 막고, 흐름은 failed 로 끝난다.
# drafter 한 번이 요청서·문의를 읽고 분류를 쓰는 데 3~4번 — 작성 세 번이 들어갈 만큼으로 잡았다.
max_tool_calls: 30

# 전달(scripts/deliver.py)과 검수(review.py)가 읽는 기준 — inbox/ 로 들어온 문의에 쓴다.
# 케이스로 연 연습 요청(--case)은 케이스 파일(cases/*.yaml)의 값을 쓴다.
# 정답표는 여기 두지 않는다 — 운영에는 정답이 없다.
triage:
  categories:
    - billing
    - account
    - bug
    - howto
  # 확신이 이보다 낮으면 사람 큐로 보낸다(기준선). 확률이 아니라 정책이다 — "0.8 미만은 사람이 본다".
  confidence_threshold: 0.8
  # 카테고리 → 담당 팀 큐. 목록에 없는 카테고리는 R2 가 먼저 막는다.
  teams:
    billing: billing-team
    account: account-team
    bug: engineering
    howto: support-l1
